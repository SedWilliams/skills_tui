[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tui-skills"
version = "0.1.0"
description = "Browse and manage local skills across coding agents"
requires-python = ">=3.9"
dependencies = ["textual>=1.0,<2", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.24,<2"]

[project.scripts]
tui-skills = "tui_skills.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
